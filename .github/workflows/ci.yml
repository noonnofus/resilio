name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  next-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        next-version: [15.5.19, 16.2.7]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @resilio/next add --save-dev next@${{ matrix.next-version }} --lockfile=false
      - run: pnpm build
      - run: pnpm --filter @resilio/next typecheck
      - run: pnpm --filter @resilio/next test
